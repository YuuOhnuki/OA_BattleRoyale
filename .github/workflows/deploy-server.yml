# main への push で、自前サーバーPC（self-hosted runner）のデータパックを更新する。
# runner が未登録の間は、ジョブが待機状態になるだけで他に影響しない。
name: deploy-server
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-server
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: [self-hosted, windows, oa-server]
    timeout-minutes: 190
    steps:
      - name: Update server datapack
        shell: powershell
        run: |
          $u = "D:\MinecraftServer\oa_battle_royale\autoupdate\update.ps1"
          $st = "D:\MinecraftServer\oa_battle_royale\autoupdate\state.json"
          # 試合中などで保留になった場合は、1分ごとに再試行する（最大約3時間）
          for ($i = 0; $i -lt 180; $i++) {
            & $u
            $s = $null
            if (Test-Path $st) { $s = Get-Content -Raw -Encoding UTF8 $st | ConvertFrom-Json }
            if (-not $s -or -not $s.pendingSha) { break }
            Start-Sleep -Seconds 60
          }
          exit 0
