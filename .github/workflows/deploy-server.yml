# main への push で、自前サーバーPC（self-hosted runner）のデータパックを更新する。
# runner が未登録の間は、ジョブが待機状態になるだけで他に影響しない。
name: deploy-server
on:
  push:
    branches: [main]
    # 文書・ツールだけの変更では本番を /reload しない（大きなデータパックの reload は数十秒サーバーを止め、
    # 2026-11-15 には同じPCでのビルドと重なって watchdog の上限 60 秒を超え、サーバーが止まった）。
    # 次にデータを変えたコミットで、その時点の HEAD がまとめて入る
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'scripts/**'
      - 'tools/**'
      - '.github/**'
      - 'VALIDATION.json'
      - 'MAP_*.json'
  workflow_dispatch:
concurrency:
  group: deploy-server
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    if: vars.OA_SERVER_OS != 'linux'
    runs-on: [self-hosted, windows, oa-server]
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v4
      # 2026-11-23：サーバーの更新スクリプトをリポジトリの版にそろえる（手で入れ直さなくてよい）。config.json・state.json は触らない
      - name: Sync autoupdate scripts
        shell: powershell
        run: |
          $d = "D:\MinecraftServer\oa_battle_royale\autoupdate"
          foreach ($f in 'apply.ps1', 'update.ps1', 'platform.ps1') { Copy-Item (Join-Path 'tools/autoupdate' $f) (Join-Path $d $f) -Force }
      - name: Update server datapack
        shell: powershell
        run: |
          $u = "D:\MinecraftServer\oa_battle_royale\autoupdate\update.ps1"
          $st = "D:\MinecraftServer\oa_battle_royale\autoupdate\state.json"
          # 試合中などで保留になった場合は、1分ごとに再試行する（最大約3時間）
          for ($i = 0; $i -lt 180; $i++) {
            # -NoReload：/reload は使わない（大きなデータパックの /reload が60秒を超え、watchdog に止められたため。2026-11-15）。
            # 新しい update.ps1（applyMode restart）は30秒予告してサーバーを再起動して反映する。古い update.ps1 はファイルを置くだけ
            & $u -NoReload
            $s = $null
            if (Test-Path $st) { $s = Get-Content -Raw -Encoding UTF8 $st | ConvertFrom-Json }
            if (-not $s -or -not $s.pendingSha) { break }
            Start-Sleep -Seconds 60
          }
          exit 0
  deploy-linux:
    if: vars.OA_SERVER_OS == 'linux'
    runs-on: [self-hosted, linux, oa-server]
    timeout-minutes: 190
    env:
      OA_SERVER_DIR: ${{ vars.OA_SERVER_DIR }}
    steps:
      - uses: actions/checkout@v4
      # 2026-11-23：サーバーの更新スクリプトをリポジトリの版にそろえる。config.json・state.json は触らない
      - name: Sync autoupdate scripts
        shell: pwsh
        run: |
          if (-not $env:OA_SERVER_DIR) { throw 'Set repository variable OA_SERVER_DIR' }
          $d = Join-Path $env:OA_SERVER_DIR 'autoupdate'
          foreach ($f in 'apply.ps1', 'update.ps1', 'platform.ps1') { Copy-Item (Join-Path 'tools/autoupdate' $f) (Join-Path $d $f) -Force }
      - name: Stage or apply datapack
        shell: pwsh
        run: |
          if (-not $env:OA_SERVER_DIR) { throw 'Set repository variable OA_SERVER_DIR' }
          $u = Join-Path $env:OA_SERVER_DIR 'autoupdate/update.ps1'
          $st = Join-Path $env:OA_SERVER_DIR 'autoupdate/state.json'
          for ($i = 0; $i -lt 180; $i++) {
            & pwsh -NoProfile -File $u -NoReload
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $s = if (Test-Path $st) { Get-Content -Raw $st | ConvertFrom-Json } else { $null }
            if (-not $s -or -not $s.pendingSha) { exit 0 }
            Start-Sleep -Seconds 60
          }
          throw 'Datapack update still deferred after 3 hours'
